# Entorno de desarrollo local: API + base de lectura + SQS simulado (LocalStack).
# Uso: docker compose up --build
services:
  reporting-api:
    build: .
    ports:
      - "3010:3010"
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/reporting
      DATABASE_USER: reporting
      DATABASE_PASSWORD: reporting
      SQS_ENABLED: "true"
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/000000000000/reporting_queue
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: reporting
      POSTGRES_USER: reporting
      POSTGRES_PASSWORD: reporting
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reporting -d reporting"]
      interval: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,sns
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name reporting_queue"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
