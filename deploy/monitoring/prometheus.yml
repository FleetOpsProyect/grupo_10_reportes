# Prometheus: recoge las métricas de la API (Actuator + Micrometer) y del host (node_exporter).
# Lo usan tanto deploy/docker-compose.prod.yml (EC2) como docker-compose.yml (local, perfil "monitoring").
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: reporting-api
    metrics_path: /metrics
    static_configs:
      - targets: ["reporting-api:3010"]
        labels:
          servicio: reportes-operativos

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
