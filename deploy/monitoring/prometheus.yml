# Prometheus: recoge las métricas de la API (Actuator + Micrometer), del host (node_exporter) y de los
# contenedores (cAdvisor). Lo usan deploy/docker-compose.prod.yml (EC2) y docker-compose.yml (local, perfil "monitoring").
# Los targets usan el puerto INTERNO de cada contenedor dentro de la red de Docker; los puertos no estándar
# (18001, 19100, 18080) son los publicados hacia afuera de la EC2.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: reporting-api
    metrics_path: /metrics
    static_configs:
      - targets: ["reporting-api:18001"]   # puerto de Actuator, separado del de la API (3010)
        labels:
          servicio: reportes-operativos

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
