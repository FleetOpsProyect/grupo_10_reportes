# Se copia a la EC2 (~/reporting) en cada despliegue. La imagen la publica el workflow deploy.yml en GHCR.
# Las variables vienen de ~/reporting/.env, que genera el workflow. Ese .env incluye IMAGE (la versión desplegada),
# así que en la EC2 se puede usar "docker compose -f docker-compose.prod.yml logs|ps|restart" sin exportar nada.
# La base de datos es la rama "production" de Neon (serverless): no hay contenedor de PostgreSQL en la EC2.
#
# Memoria (t3.small = 2 GiB): cada servicio tiene un límite según su consumo medido con "docker stats"
# (API ~250 MB, Grafana ~250 MB, Prometheus ~35 MB, node_exporter ~12 MB). La JVM usa el 60 % del límite de su
# contenedor para el heap (JAVA_OPTS en el Dockerfile); el resto queda para metaspace, hilos y código compilado.
services:
  reporting-api:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod   # logs en JSON para CloudWatch
    ports:
      - "3010:3010"
    mem_limit: 640m
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- Observabilidad ----------------
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"   # solo desde la EC2 (túnel SSH); hacia afuera se ve a través de Grafana
    mem_limit: 192m
    logging: *logs

  grafana:
    image: grafana/grafana:13.3.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Falta GRAFANA_ADMIN_PASSWORD en el .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DATE_FORMATS_DEFAULT_TIMEZONE: America/Bogota
      # Grafana 13 descarga y carga al arrancar plugins que no usamos (Logs, Traces, Profiles, Drilldown).
      # Se desactivan y se usa una carpeta de plugins vacía, para que tampoco cargue los ya descargados en el volumen.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PATHS_PLUGINS: /var/lib/grafana/plugins-fleetops
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    mem_limit: 512m
    logging: *logs

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    pid: host
    mem_limit: 64m
    logging: *logs

volumes:
  prometheus-data:
  grafana-data:
