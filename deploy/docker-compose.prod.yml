# Se copia a la EC2 (~/reporting) en cada despliegue. La imagen la publica el workflow deploy.yml en GHCR.
# Las variables vienen de ~/reporting/.env, que genera el workflow. Ese .env incluye IMAGE (la versión desplegada),
# así que en la EC2 se puede usar "docker compose -f docker-compose.prod.yml logs|ps|restart" sin exportar nada.
# La base de datos es la rama "production" de Neon (serverless): no hay contenedor de PostgreSQL en la EC2.
#
# Memoria (t3.small = 2 GiB): cada servicio tiene un límite según su consumo medido con "docker stats"
# (API ~250 MB, cAdvisor ~60 MB, node_exporter ~12 MB). La JVM usa el 60 % del límite de su
# contenedor para el heap (JAVA_OPTS en el Dockerfile); el resto queda para metaspace, hilos y código compilado.
#
# Puertos (guía del dojo de monitoreo): ninguno es el de por defecto de su herramienta.
# Prometheus y Grafana corren en local (monitoring/docker-compose.yml), no aquí.
#   3010  API                          -> Security Group: abierto (luego, solo el API Gateway)
#   18001 Actuator (/metrics, /health) -> Security Group: solo IPs del equipo
#   19100 node_exporter                -> Security Group: solo IPs del equipo
#   18080 cAdvisor                     -> Security Group: solo IPs del equipo
services:
  reporting-api:
    image: ${IMAGE}
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod   # logs en JSON para CloudWatch
    ports:
      - "3010:3010"     # API
      - "18001:18001"   # Actuator: métricas y salud, separado de la API
    mem_limit: 640m
    logging: &logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------- Exporters (los lee el Prometheus local, ver monitoring/) ----------------
  # Prometheus y Grafana NO corren en la EC2: viven en la máquina de quien monitorea, para no gastar
  # memoria de producción. Aquí solo quedan los exporters, que son livianos.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    pid: host
    ports:
      - "19100:9100"
    mem_limit: 64m
    logging: *logs

  # Métricas de cada contenedor (CPU, memoria, red y disco por contenedor)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    command:
      - --docker_only=true            # solo contenedores Docker, no cada cgroup del sistema
      - --housekeeping_interval=15s   # igual al scrape de Prometheus; baja el uso de CPU
      - --store_container_labels=false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    devices:
      - /dev/kmsg
    privileged: true
    ports:
      - "18080:8080"
    mem_limit: 128m
    logging: *logs

