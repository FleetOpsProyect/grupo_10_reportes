# Toda la configuración llega por variables de entorno (ver .env.example).
# En local se leen desde el archivo .env de la raíz del proyecto (IDE o ./mvnw spring-boot:run).
# En Docker/EC2 llegan como variables de entorno del contenedor y el .env no se usa.
server:
  port: ${SERVER_PORT:3010}

spring:
  application:
    name: reporting
  config:
    import: optional:file:.env[.properties]
  # Base de lectura en Neon (PostgreSQL serverless): rama "develop" para desarrollo y "production" para main.
  # Usuario y clave van aparte, nunca dentro de DATABASE_URL: Flyway y Hibernate imprimen la URL en los logs.
  # Sin valores por defecto a propósito: si falta la configuración, el arranque falla.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      # Neon suspende el cómputo cuando no hay actividad: no mantener conexiones ociosas y tolerar el
      # arranque en frío (unos segundos) en la primera conexión.
      minimum-idle: 0
      maximum-pool-size: 5
      idle-timeout: 60000
      max-lifetime: 300000
      connection-timeout: 15000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

# /health, /health/liveness, /health/readiness y /metrics (Prometheus)
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Parámetros propios del servicio (DAS v1.1 / backlog V3.0)
reporting:
  timeout: ${REPORTES_TIMEOUT_MS:3000}ms
  circuit-breaker:
    fallos: ${REPORTES_CB_FALLOS:5}
    espera: ${REPORTES_CB_ESPERA_S:30}s
  cache-ttl: ${REPORTES_CACHE_TTL_S:0}s
  fuentes:
    vehiculos: ${FUENTE_VEHICULOS_URL:http://localhost:8081}
    asignaciones: ${FUENTE_ASIGNACIONES_URL:http://localhost:8082}
    incidentes: ${FUENTE_INCIDENTES_URL:http://localhost:8083}
    mantenimiento: ${FUENTE_MANTENIMIENTO_URL:http://localhost:8084}
    combustible: ${FUENTE_COMBUSTIBLE_URL:http://localhost:8085}
    telemetria: ${FUENTE_TELEMETRIA_URL:http://localhost:8086}
    notificaciones: ${FUENTE_NOTIFICACIONES_URL:http://localhost:8087}
  sqs:
    enabled: ${SQS_ENABLED:false}
    queue-url: ${SQS_QUEUE_URL:}
    region: ${AWS_REGION:us-east-1}
    endpoint: ${SQS_ENDPOINT:}
    wait-seconds: 20
    max-messages: 10

---
# Perfil "prod" (EC2): logs en JSON por stdout para CloudWatch, con el MDC (correlation_id).
# En local no se activa: los logs salen en texto legible y con el banner de Spring.
spring:
  config:
    activate:
      on-profile: prod

logging:
  structured:
    format:
      console: logstash
