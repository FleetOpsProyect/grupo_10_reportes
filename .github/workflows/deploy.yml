# Despliegue continuo: corre solo al fusionar en main (o manualmente).
# No vuelve a correr pruebas ni Sonar: el código ya pasó el CI en el PR a develop.
#   1. Construye la imagen Docker y la publica en GitHub Container Registry (GHCR).
#   2. Copia docker-compose.prod.yml a la EC2 y levanta la nueva versión por SSH.
name: Deploy EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  imagen:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.nombre.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: nombre
        run: echo "image=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.nombre.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar en EC2
    needs: imagen
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copiar docker-compose a la EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: ~/reporting
          strip_components: 1

      - name: Levantar la nueva versión
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.imagen.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/reporting
            test -f .env || { echo "Falta ~/reporting/.env en la EC2 (copiar desde .env.example)"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            export IMAGE
            docker compose -f docker-compose.prod.yml pull reporting-api
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f

      - name: Verificar salud
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:3010/health/readiness > /dev/null; then echo "Servicio listo"; exit 0; fi
              sleep 6
            done
            echo "El servicio no respondió /health/readiness"; docker compose -f ~/reporting/docker-compose.prod.yml logs --tail=100 reporting-api; exit 1
