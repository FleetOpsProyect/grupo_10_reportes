# Despliegue continuo: corre solo al fusionar en main (o manualmente).
# No vuelve a correr pruebas ni Sonar: el código ya pasó el CI en el PR a develop.
#   1. Construye la imagen Docker y la publica en GitHub Container Registry (GHCR).
#   2. Genera el .env de producción desde el environment "production" de GitHub, lo copia a la EC2
#      junto con docker-compose.prod.yml y levanta la nueva versión por SSH.
name: Deploy EC2

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  imagen:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.nombre.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Nombre de la imagen (GHCR exige minúsculas)
        id: nombre
        env:
          SHA: ${{ github.sha }}
        run: echo "image=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):${SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.nombre.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desplegar:
    name: Desplegar en EC2
    needs: imagen
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # La configuración de producción vive en GitHub (Settings → Environments → production).
      # Secrets: DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD y GRAFANA_ADMIN_PASSWORD. El resto son variables
      # opcionales: si una no está definida no se escribe y la app usa su valor por defecto (application.yml).
      - name: Generar .env de producción
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          REPORTES_TIMEOUT_MS: ${{ vars.REPORTES_TIMEOUT_MS }}
          REPORTES_CB_FALLOS: ${{ vars.REPORTES_CB_FALLOS }}
          REPORTES_CB_ESPERA_S: ${{ vars.REPORTES_CB_ESPERA_S }}
          REPORTES_CACHE_TTL_S: ${{ vars.REPORTES_CACHE_TTL_S }}
          FUENTE_VEHICULOS_URL: ${{ vars.FUENTE_VEHICULOS_URL }}
          FUENTE_ASIGNACIONES_URL: ${{ vars.FUENTE_ASIGNACIONES_URL }}
          FUENTE_INCIDENTES_URL: ${{ vars.FUENTE_INCIDENTES_URL }}
          FUENTE_MANTENIMIENTO_URL: ${{ vars.FUENTE_MANTENIMIENTO_URL }}
          FUENTE_COMBUSTIBLE_URL: ${{ vars.FUENTE_COMBUSTIBLE_URL }}
          FUENTE_TELEMETRIA_URL: ${{ vars.FUENTE_TELEMETRIA_URL }}
          FUENTE_NOTIFICACIONES_URL: ${{ vars.FUENTE_NOTIFICACIONES_URL }}
          SQS_ENABLED: ${{ vars.SQS_ENABLED }}
          SQS_QUEUE_URL: ${{ vars.SQS_QUEUE_URL }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE: ${{ needs.imagen.outputs.image }}
        run: |
          for obligatoria in DATABASE_URL DATABASE_USER DATABASE_PASSWORD GRAFANA_ADMIN_PASSWORD; do
            if [ -z "${!obligatoria}" ]; then
              echo "::error::Falta el secreto $obligatoria en el environment production"; exit 1
            fi
          done
          case "$DATABASE_URL" in
            jdbc:postgresql://*) ;;
            *) echo "::error::DATABASE_URL debe empezar con jdbc:postgresql://"; exit 1 ;;
          esac
          case "$DATABASE_URL" in
            *password=*|*user=*) echo "::error::DATABASE_URL no debe llevar user= ni password= (van en sus propios secretos)"; exit 1 ;;
          esac
          # Sin umask 077: scp-action corre en un contenedor con otro usuario y necesita leer el archivo.
          # El runner es efímero y el archivo se borra al final del job; en la EC2 queda con chmod 600.
          # IMAGE va primero: docker compose lee el .env de la carpeta para resolver ${IMAGE}, así los comandos
          # manuales en la EC2 (logs, ps, restart) funcionan sin exportar nada.
          printf 'IMAGE=%s\n' "$IMAGE" > deploy/.env
          for nombre in DATABASE_URL DATABASE_USER DATABASE_PASSWORD GRAFANA_ADMIN_PASSWORD \
                        REPORTES_TIMEOUT_MS REPORTES_CB_FALLOS REPORTES_CB_ESPERA_S REPORTES_CACHE_TTL_S \
                        FUENTE_VEHICULOS_URL FUENTE_ASIGNACIONES_URL FUENTE_INCIDENTES_URL FUENTE_MANTENIMIENTO_URL \
                        FUENTE_COMBUSTIBLE_URL FUENTE_TELEMETRIA_URL FUENTE_NOTIFICACIONES_URL \
                        SQS_ENABLED SQS_QUEUE_URL AWS_REGION; do
            if [ -n "${!nombre}" ]; then printf '%s=%s\n' "$nombre" "${!nombre}" >> deploy/.env; fi
          done
          echo "Variables escritas en .env: $(cut -d= -f1 deploy/.env | tr '\n' ' ')"

      - name: Copiar docker-compose, monitoreo y .env a la EC2
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,deploy/.env,deploy/monitoring
          target: ~/reporting
          strip_components: 1

      - name: Borrar el .env del runner
        if: always()
        run: rm -f deploy/.env

      - name: Levantar la nueva versión
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/reporting
            chmod 600 .env
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # IMAGE se toma del .env de esta carpeta (lo escribe el paso "Generar .env de producción")
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # Grafana y Prometheus no se reinician solos si solo cambió su configuración montada
            docker compose -f docker-compose.prod.yml restart prometheus grafana
            docker logout ghcr.io
            docker image prune -f

      - name: Verificar salud
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in $(seq 1 20); do
              if curl -fsS http://localhost:3010/health/readiness > /dev/null; then echo "Servicio listo"; exit 0; fi
              sleep 6
            done
            echo "El servicio no respondió /health/readiness"; docker compose -f ~/reporting/docker-compose.prod.yml logs --tail=100 reporting-api; exit 1
