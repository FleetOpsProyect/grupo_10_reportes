# Integración continua sobre develop (main no corre CI: solo despliega).
#   - PR hacia develop: compila, prueba, cobertura (JaCoCo) y SonarQube con Quality Gate. Si falla, no se fusiona
#     (activar "Require status checks" en la protección de develop).
#   - Push a develop (al fusionar un PR): el mismo análisis, para que SonarQube Cloud muestre el estado de la
#     rama develop, que es la rama principal del proyecto en SonarCloud.
name: CI

on:
  pull_request:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "docs/**"
  push:
    branches: [develop]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test-sonar:
    name: Build, pruebas y SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarQube necesita el historial completo para el análisis de código nuevo

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache de SonarQube
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar

      # Proyecto, organización y host de SonarQube Cloud están en el pom.xml; aquí solo va el token.
      - name: Compilar, probar y analizar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          chmod +x mvnw
          ./mvnw -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.qualitygate.wait=true

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
